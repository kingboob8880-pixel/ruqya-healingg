<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Духовный центр Абу Мухаммада | Архив рукъи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8f0e0 0%, #f3e5c9 100%);
            font-family: 'Segoe UI', 'Amiri', 'Georgia', serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Золотая карточка приветствия */
        .header-card {
            background: linear-gradient(145deg, #fff6e6, #fcefcb);
            border-radius: 48px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            border: 1px solid #e8d5a3;
        }

        .gold-title {
            font-size: 2rem;
            color: #b37b2e;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #7a5a2e;
            font-size: 1.1rem;
            border-top: 2px solid #e2c48b;
            display: inline-block;
            padding-top: 0.5rem;
        }

        /* Список файлов */
        .files-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 2rem;
        }

        .file-card {
            background: rgba(255, 252, 240, 0.95);
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s ease;
            border: 1px solid #eedfa8;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
        }

        .file-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(0,0,0,0.15);
            border-color: #d4aa5a;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .file-icon {
            font-size: 2.2rem;
        }

        .file-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4a3727;
            word-break: break-all;
        }

        .file-date {
            font-size: 0.8rem;
            color: #a08147;
            margin-top: 5px;
        }

        .btn-visit {
            background: #d4a53c;
            color: #2c2418;
            padding: 10px 24px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-visit:hover {
            background: #c4922a;
            transform: scale(1.02);
            color: white;
        }

        .empty-message {
            background: #fff2df;
            padding: 2rem;
            border-radius: 32px;
            text-align: center;
            color: #8b6942;
        }

        .footer-note {
            text-align: center;
            margin-top: 2rem;
            color: #b49463;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: #c9a03d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <div class="gold-title">📖 Духовный центр Абу Мухаммада</div>
        <div class="subtitle">Архив рукъя-анализов и исцеляющих страниц</div>
        <p style="margin-top: 20px; color: #5e4a2a;">Да облегчит Аллах путь к исцелению каждого, кто откроет эти страницы</p>
    </div>

    <div id="fileListContainer" class="files-grid">
        <div class="loading">🔍 Загрузка списка доступных страниц...</div>
    </div>
    
    <div class="footer-note">
        🤲 Да примет Аллах наше благое намерение. Каждая страница — ключ к исцелению с дозволения Всевышнего.
    </div>
</div>

<script>
    // Функция для получения списка HTML файлов из репозитория GitHub
    async function fetchHtmlFiles() {
        const container = document.getElementById('fileListContainer');
        
        // Получаем имя репозитория из текущего URL
        const repoPath = window.location.pathname; // /ruqya-healingg/
        const repoName = repoPath.split('/')[1]; // ruqya-healingg
        const owner = 'kingboob8880-pixel'; // твой username
        
        // API GitHub для получения содержимого
        const apiUrl = `https://api.github.com/repos/${owner}/${repoName}/contents/`;
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Не удалось загрузить список');
            
            const files = await response.json();
            // Фильтруем только .html файлы, исключаем index.html (главную)
            const htmlFiles = files.filter(file => 
                file.name.endsWith('.html') && 
                file.name.toLowerCase() !== 'index.html'
            );
            
            if (htmlFiles.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        🌙 Пока нет добавленных анализов. 
                        <br>Загрузите HTML-файлы с рукъя и они появятся здесь автоматически.
                        <br><br>✨ Вы можете загрузить первый файл через GitHub → Add file → Upload files
                    </div>
                `;
                return;
            }
            
            // Сортируем по дате изменения (новые сверху)
            htmlFiles.sort((a, b) => new Date(b.commit?.committer?.date || 0) - new Date(a.commit?.committer?.date || 0));
            
            // Генерируем карточки для каждого файла
            let cardsHtml = '';
            for (const file of htmlFiles) {
                // Пытаемся получить дату (не всегда есть, но стараемся)
                let dateStr = '';
                if (file.commit?.committer?.date) {
                    const date = new Date(file.commit.committer.date);
                    dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                }
                
                // Определяем иконку по названию (можно кастомизировать)
                let icon = '📄';
                if (file.name.includes('анализ') || file.name.includes('analysis')) icon = '🕯️';
                if (file.name.includes('сестра') || file.name.includes('brother')) icon = '🌿';
                if (file.name.includes('дуа') || file.name.includes('dua')) icon = '🤲';
                
                cardsHtml += `
                    <div class="file-card">
                        <div class="file-info">
                            <div class="file-icon">${icon}</div>
                            <div>
                                <div class="file-name">${escapeHtml(file.name)}</div>
                                ${dateStr ? `<div class="file-date">📅 ${dateStr}</div>` : ''}
                            </div>
                        </div>
                        <a href="${file.name}" class="btn-visit" target="_blank">📖 Открыть анализ</a>
                    </div>
                `;
            }
            
            container.innerHTML = cardsHtml;
            
        } catch (error) {
            console.error('Ошибка:', error);
            container.innerHTML = `
                <div class="empty-message">
                    ⚠️ Не удалось загрузить список файлов. 
                    <br>Убедитесь, что репозиторий публичный и доступен.
                    <br><br>💡 Альтернативно, вы можете вручную перейти к файлам по ссылке: 
                    <br><code>https://kingboob8880-pixel.github.io/ruqya-healingg/имя_файла.html</code>
                </div>
            `;
        }
    }
    
    // Простая защита от XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // Запускаем загрузку списка
    fetchHtmlFiles();
</script>
</body>
</html>
