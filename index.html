<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Архив рукъя-анализов, дуа и исцеляющих страниц. Духовный центр Абу Мухаммада.">
    <meta name="theme-color" content="#b37b2e">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Духовный центр Абу Мухаммада">
    <meta property="og:description" content="Архив рукъя-анализов, дуа и исцеляющих страниц">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    
    <!-- PWA & GitHub Pages compatibility -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Безопасный CSP для GitHub Pages -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' https:; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   img-src 'self' data: https:; 
                   connect-src 'self' https://api.github.com https://kingboob8880-pixel.github.io;">
    
    <title>Духовный центр Абу Мухаммада | Архив рукъи</title>
    
    <!-- Оптимизированный favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
    
    <!-- Preconnect для шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Оптимизированная загрузка шрифтов -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" 
          rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    
    <style>
        /* ===== CSS VARIABLES & RESET ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            /* Цветовая палитра */
            --bg-start: #faf5eb; --bg-end: #f0e6d2;
            --card-bg: rgba(255, 252, 245, 0.92); --card-bg-solid: #fffcf5;
            --text: #3d2e1e; --text-sec: #7a5f3a; --text-muted: #a08b6d;
            --accent: #b37b2e; --accent-hover: #c9922e;
            --accent-glow: rgba(179, 123, 46, 0.15); --accent-soft: rgba(179, 123, 46, 0.08);
            --border: #e8dcc4; --border-light: #f0e8d6;
            --shadow: rgba(60, 40, 10, 0.06); --shadow-lg: rgba(60, 40, 10, 0.12);
            --danger: #c0392b; --success: #27ae60;
            --pattern-opacity: 0.03;
            
            /* Размеры */
            --radius-sm: 12px; --radius-md: 20px; --radius-lg: 28px; --radius-xl: 40px;
            --container-max: 960px;
            
            /* Анимации */
            --transition-fast: 150ms ease; --transition-normal: 250ms ease; --transition-slow: 400ms ease;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-start: #141824; --bg-end: #0f1320;
                --card-bg: rgba(28, 33, 50, 0.92); --card-bg-solid: #1c2132;
                --text: #e8dfd0; --text-sec: #c4aa7a; --text-muted: #8a7a60;
                --accent: #d4a53c; --accent-hover: #e4b84c;
                --accent-glow: rgba(212, 165, 60, 0.12); --accent-soft: rgba(212, 165, 60, 0.06);
                --border: #2a3048; --border-light: #222840;
                --shadow: rgba(0, 0, 0, 0.25); --shadow-lg: rgba(0, 0, 0, 0.4);
                --pattern-opacity: 0.02;
            }
        }
        
        body {
            background: var(--bg-start);
            background-image: linear-gradient(180deg, var(--bg-start), var(--bg-end));
            font-family: 'Noto Sans', 'Noto Naskh Arabic', system-ui, -apple-system, sans-serif;
            min-height: 100vh; color: var(--text);
            transition: background var(--transition-slow), color var(--transition-slow);
            overflow-x: hidden; line-height: 1.5;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        
        /* Оптимизированный фон с паттерном */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: 
                radial-gradient(circle at 25% 25%, var(--accent) 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, var(--accent) 1px, transparent 1px);
            background-size: 60px 60px, 60px 60px;
            opacity: var(--pattern-opacity);
            will-change: opacity;
        }
        
        /* Контейнер */
        .container {
            max-width: var(--container-max); margin: 0 auto; padding: 20px 16px 40px;
            position: relative; z-index: 1;
        }
        
        /* ===== HEADER CARD ===== */
        .header-card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border-radius: var(--radius-lg);
            padding: 2.5rem 2rem 2rem; text-align: center; margin-bottom: 1.2rem;
            box-shadow: 0 8px 32px var(--shadow); border: 1px solid var(--border);
            position: relative; overflow: hidden;
            animation: fadeSlideDown var(--transition-normal) ease-out;
            will-change: transform, opacity;
        }
        
        .header-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        
        .gold-title {
            font-family: 'Noto Naskh Arabic', serif; font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700; color: var(--accent); margin-bottom: 0.5rem;
        }
        
        .subtitle { color: var(--text-sec); font-size: 0.95rem; font-weight: 500; }
        
        .quote-box {
            margin-top: 1.2rem; padding: 0.8rem 1.2rem;
            background: var(--accent-soft); border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent); font-style: italic;
            color: var(--text-sec); font-size: 0.9rem; line-height: 1.6;
        }
        
        /* Прогресс-бар */
        .progress-section {
            display: flex; align-items: center; gap: 12px; margin-top: 1.2rem;
            padding-top: 1rem; border-top: 1px solid var(--border-light);
        }
        
        .progress-label { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; font-weight: 600; }
        .progress-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); border-radius: 3px; transition: width var(--transition-normal); }
        .progress-count { font-size: 0.8rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
        
        /* ===== CONTROLS BAR ===== */
        .controls-bar {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(20px);
            padding: 10px 14px; border-radius: var(--radius-xl); border: 1px solid var(--border);
            animation: fadeSlideDown var(--transition-normal) ease-out 0.1s both;
            will-change: transform, opacity;
        }
        
        .repo-select-wrap { display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0; flex-wrap: wrap; }
        .repo-select-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        
        #repoSelect {
            max-width: min(280px, 42vw); min-width: 120px; font-size: 0.8rem;
            padding: 8px 28px 8px 12px; background: var(--card-bg-solid);
            border: 1px solid var(--border); border-radius: var(--radius-xl);
            color: var(--text); font-family: inherit; cursor: pointer;
        }
        
        /* Кнопки */
        select, button, .btn {
            appearance: none; -webkit-appearance: none;
            background: var(--card-bg-solid); border: 1px solid var(--border);
            padding: 10px 16px; border-radius: var(--radius-xl); cursor: pointer;
            font-weight: 600; color: var(--text-sec); font-family: inherit; font-size: 0.85rem;
            transition: all var(--transition-fast); min-height: 40px; outline: none; white-space: nowrap;
        }
        
        select:hover, button:hover, .btn:hover {
            background: var(--accent); color: white; border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .btn-icon {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            padding: 0; font-size: 1.1rem; border-radius: 50%;
        }
        
        .btn-active { background: var(--accent) !important; color: white !important; border-color: var(--accent) !important; }
        .btn-success { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .btn-success:hover { background: #2ecc71 !important; border-color: #2ecc71 !important; }
        .btn-with-text { display: flex; align-items: center; gap: 6px; padding: 10px 16px; }
        .btn-danger { color: var(--danger); border-color: rgba(192, 57, 43, 0.35); }
        .btn-danger:hover { background: var(--danger); color: white; border-color: var(--danger); }
        
        /* Поиск */
        .search-box { flex: 2; min-width: 140px; position: relative; }
        .search-box input {
            width: 100%; padding: 10px 36px 10px 38px; border-radius: var(--radius-xl);
            border: 1px solid var(--border); background: var(--card-bg-solid);
            color: var(--text); font-size: 0.9rem; font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            outline: none;
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .search-box::before {
            content: '🔍'; position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); font-size: 0.85rem; pointer-events: none;
        }
        .search-hint {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            font-size: 0.65rem; color: var(--text-muted); background: var(--border);
            padding: 2px 6px; border-radius: 4px; font-weight: 600; pointer-events: none;
        }
        .search-clear {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none !important; border: none !important; font-size: 1rem;
            cursor: pointer; color: var(--text-muted); padding: 4px; display: none;
            min-height: auto; line-height: 1; z-index: 2;
        }
        .search-clear:hover { color: var(--accent) !important; }
        
        /* ===== TOKEN SECTION ===== */
        .token-section { animation: fadeSlideDown var(--transition-normal) ease-out 0.15s both; margin-bottom: 12px; }
        .token-toggle {
            display: flex; align-items: center; gap: 8px;
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: var(--radius-xl);
            padding: 8px 16px; cursor: pointer; font-size: 0.85rem;
            color: var(--text-muted); width: 100%; font-family: inherit;
            font-weight: 500; transition: all var(--transition-fast);
        }
        .token-toggle:hover { color: var(--accent); border-color: var(--accent); }
        .token-toggle .chevron { transition: transform var(--transition-normal); font-size: 0.7rem; margin-left: auto; }
        .token-toggle.open .chevron { transform: rotate(180deg); }
        .token-toggle .token-status-badge { font-size: 0.75rem; margin-left: 4px; }
        
        .token-body { max-height: 0; overflow: hidden; transition: max-height var(--transition-normal) ease; }
        .token-body.open { max-height: 320px; }
        
        .token-body-inner {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            background: var(--card-bg); padding: 10px 14px;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            border: 1px solid var(--border); border-top: none; margin-top: -6px;
        }
        
        .token-input {
            flex: 1; min-width: 180px; padding: 10px 14px; border-radius: var(--radius-xl);
            border: 1px solid var(--border); background: var(--card-bg-solid);
            color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none;
        }
        .token-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        
        /* ===== WRITE MODE BANNER ===== */
        .write-mode-banner {
            display: none; background: var(--accent-soft); border: 1px solid var(--accent);
            border-radius: var(--radius-lg); padding: 10px 14px; margin-bottom: 12px;
            font-size: 0.85rem; color: var(--text-sec); font-weight: 600; line-height: 1.45;
            animation: fadeSlideDown var(--transition-normal) ease-out 0.12s both;
        }
        body.write-mode .write-mode-banner { display: block; }
        #actionBar { display: none; }
        body.write-mode #actionBar { display: flex; border-color: var(--accent); box-shadow: 0 4px 16px var(--accent-glow); }
        body.readonly-share #actionBar,
        body.readonly-share .token-section,
        body.readonly-share .write-mode-banner { display: none !important; }
        
        /* ===== BREADCRUMB ===== */
        #breadcrumbArea { margin-bottom: 12px; animation: fadeSlideDown var(--transition-normal) ease-out 0.2s both; }
        .breadcrumb {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--card-bg); backdrop-filter: blur(20px);
            border-radius: var(--radius-xl); padding: 6px 14px; font-size: 0.85rem;
            flex-wrap: wrap; border: 1px solid var(--border);
        }
        .breadcrumb-item, .breadcrumb-root {
            display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
            padding: 4px 8px; border-radius: var(--radius-sm); transition: background var(--transition-fast);
            font-weight: 500;
        }
        .breadcrumb-item:hover, .breadcrumb-root:hover { background: var(--accent-soft); }
        .breadcrumb-sep { color: var(--text-muted); font-size: 0.75rem; }
        
        /* ===== STATS & FILES ===== */
        .stats-bar {
            display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
            font-size: 0.8rem; color: var(--text-muted); font-weight: 500;
            animation: fadeSlideDown var(--transition-normal) ease-out 0.25s both;
        }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        
        .files-grid {
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 2rem;
            contain: content;
        }
        .files-grid.grid-view {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
        }
        
        .file-card, .folder-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 14px;
            transition: all var(--transition-fast); position: relative; cursor: pointer;
            opacity: 0; animation: fadeCardIn var(--transition-normal) ease-out forwards;
            overflow: visible; z-index: 1;
            content-visibility: auto; contain-intrinsic-size: 88px 320px;
        }
        
        .file-card::before, .folder-card::before {
            content: ''; position: absolute; inset: 0;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: inherit; z-index: -1; pointer-events: none;
        }
        
        .file-card.has-menu-open, .folder-card.has-menu-open { z-index: 100; }
        .file-card:hover, .folder-card:hover {
            border-color: var(--accent); box-shadow: 0 4px 20px var(--shadow);
            transform: translateY(-1px);
        }
        .file-card.draggable { cursor: grab; }
        .folder-card.drag-over { border: 2px dashed var(--accent); background: var(--accent-glow); }
        
        .item-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
        .item-main { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .item-icon {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; background: var(--accent-soft); border-radius: var(--radius-sm); flex-shrink: 0;
        }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: 0.9rem; word-break: break-word; line-height: 1.3; }
        .item-name mark { background: var(--accent); color: white; padding: 0 2px; border-radius: 3px; }
        .item-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
        .item-size { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
        .tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag {
            background: var(--accent); color: white; padding: 1px 8px;
            border-radius: 20px; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.02em;
        }
        .status-badges { display: flex; gap: 4px; align-items: center; }
        .badge { font-size: 0.75rem; opacity: 0.7; }
        .badge.active { opacity: 1; }
        .folder-lock-icon { font-size: 0.8rem; opacity: 0.8; flex-shrink: 0; margin-left: 4px; }
        
        .item-actions { display: flex; align-items: center; gap: 2px; position: relative; z-index: 10; }
        .menu-btn {
            background: none !important; border: none !important; font-size: 1.2rem;
            cursor: pointer; padding: 6px; min-width: 36px; min-height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: all var(--transition-fast);
        }
        .menu-btn:hover { background: var(--accent-soft) !important; color: var(--accent); }
        
        /* Выпадающее меню */
        .dropdown-menu {
            position: absolute; right: 0; top: 42px;
            background: var(--card-bg-solid); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: 0 8px 32px var(--shadow-lg);
            z-index: 9999; display: none; flex-direction: column;
            min-width: 220px; max-width: calc(100vw - 20px);
            overflow: hidden; animation: fadeScaleIn var(--transition-fast) ease-out;
        }
        .dropdown-menu button {
            background: none !important; border: none !important; text-align: left;
            padding: 10px 16px; border-radius: 0 !important; width: 100%;
            font-size: 0.85rem; color: var(--text); font-weight: 500; min-height: auto;
        }
        .dropdown-menu button:hover { background: var(--accent) !important; color: white !important; }
        .dropdown-menu .divider { height: 1px; background: var(--border); margin: 4px 0; }
        
        /* Empty state */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }
        .empty-state .empty-text { font-size: 1rem; font-weight: 600; margin-bottom: 0.3rem; }
        .empty-state .empty-hint { font-size: 0.85rem; }
        
        /* Skeleton loader */
        .loading-skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--card-bg) 50%, var(--border) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
            border-radius: var(--radius-md); height: 64px; margin: 6px 0;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* Toast notifications */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg-solid); color: var(--text); padding: 12px 24px;
            border-radius: var(--radius-xl); z-index: 10000;
            box-shadow: 0 8px 32px var(--shadow-lg); border: 1px solid var(--border);
            font-weight: 600; font-size: 0.9rem; animation: slideUp var(--transition-fast) ease-out;
            max-width: 90vw; text-align: center;
        }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        
        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000; animation: fadeIn var(--transition-fast);
            padding: 16px;
        }
        .modal-card {
            background: var(--card-bg-solid); border-radius: var(--radius-lg);
            padding: 1.5rem; width: 100%; max-width: 600px; max-height: 90vh;
            overflow-y: auto; box-shadow: 0 16px 64px var(--shadow-lg);
            border: 1px solid var(--border); animation: fadeScaleIn var(--transition-normal) ease-out;
            contain: layout style;
        }
        .modal-title {
            font-size: 1.1rem; font-weight: 700; color: var(--accent);
            margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;
        }
        .modal-field { margin-bottom: 1rem; }
        .modal-field label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--text-sec); margin-bottom: 6px;
        }
        .modal-field input, .modal-field textarea, .modal-field select {
            width: 100%; padding: 10px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card-bg);
            color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none;
        }
        .modal-field textarea {
            min-height: 200px; resize: vertical; font-family: 'Courier New', monospace;
            font-size: 0.8rem; line-height: 1.5;
        }
        .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.2rem; flex-wrap: wrap; }
        .modal-actions button { min-height: 38px; flex: 1; min-width: 100px; }
        
        /* Footer */
        .footer-note {
            text-align: center; margin-top: 1.5rem; padding: 1rem;
            font-size: 0.85rem; color: var(--text-muted);
        }
        .footer-note a, .footer-note button {
            background: none !important; border: none !important;
            color: var(--accent); cursor: pointer; font-weight: 600;
            font-family: inherit; font-size: 0.85rem; min-height: auto; padding: 0;
        }
        .footer-note a:hover, .footer-note button:hover { color: var(--accent-hover); }
        
        /* Global spinner */
        .global-spinner {
            position: fixed; top: 20px; right: 20px;
            background: var(--accent); color: white; padding: 6px 12px;
            border-radius: 40px; font-size: 0.8rem; z-index: 2000;
            display: none; align-items: center; gap: 6px;
            box-shadow: 0 4px 12px var(--shadow-lg);
        }
        .global-spinner.show { display: flex; }
        
        /* Анимации */
        @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeScaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .container { padding: 16px 12px 36px; }
            .files-grid.grid-view { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            .modal-card { width: min(94vw, 600px); }
        }
        
        @media (max-width: 768px) {
            .container { padding: 12px 10px 30px; }
            .header-card { padding: 1.5rem 1.2rem 1.2rem; border-radius: var(--radius-md); }
            .gold-title { font-size: 1.55rem; }
            .subtitle { font-size: 0.88rem; }
            .quote-box { padding: 0.75rem 1rem; font-size: 0.85rem; }
            .progress-section { flex-wrap: wrap; gap: 8px; }
            .progress-label, .progress-count { width: 100%; }
            
            .controls-bar, .token-body-inner, .stats-bar, .modal-actions {
                flex-direction: column; align-items: stretch;
            }
            .controls-bar { border-radius: var(--radius-lg); padding: 10px; }
            .controls-bar > * { width: 100%; }
            .search-box { min-width: 100%; }
            .controls-bar select, .controls-bar > button,
            #actionBar button, .token-body-inner button, .modal-actions button { width: 100%; }
            .controls-bar .btn-icon { width: 100%; height: 42px; }
            #favFilterBtn, #themeToggle { font-size: 1rem; }
            #actionBar .btn-with-text { justify-content: center; }
            .token-input { min-width: 100%; }
            
            .breadcrumb { display: flex; width: 100%; padding: 8px 10px; border-radius: var(--radius-lg); }
            .breadcrumb-item, .breadcrumb-root { max-width: 100%; font-size: 0.8rem; }
            .stats-bar { gap: 8px; }
            .stat-item {
                justify-content: center; background: var(--card-bg);
                border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px;
            }
            
            .file-card, .folder-card { padding: 12px; }
            .item-row { align-items: flex-start; }
            .item-icon { width: 38px; height: 38px; font-size: 1.2rem; }
            .item-actions { align-self: flex-start; }
            .dropdown-menu { right: auto; left: 0; min-width: min(240px, calc(100vw - 40px)); }
            
            .modal-card { padding: 1rem; max-height: 86vh; }
            .modal-field textarea { min-height: 180px; }
        }
        
        @media (max-width: 640px) {
            .gold-title { font-size: 1.4rem; }
            .header-card { padding: 1.2rem 1rem 1rem; }
            .controls-bar { gap: 7px; }

        /* ===== ACCESSIBILITY ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;

            padding: 8px 16px; z-index: 10001;
            text-decoration: none; font-weight: 600;
        }

    </style>
</head>

    <!-- Вспомогательный класс для скрытия лейблов -->
    <style>
        .visually-hidden {
            position: absolute !important;
            width: 1px !important; height: 1px !important;
            padding: 0 !important; margin: -1px !important;
            overflow: hidden !important; clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important; border: 0 !important;
        }
    </style>

    <script>
    (function(){
        'use strict';
        
        // ===== CONFIG =====
        const CONFIG = {
            owner: 'kingboob8880-pixel',
            repo: 'ruqya-healingg',
            branch: 'main',
            pagesBase: 'https://kingboob8880-pixel.github.io/ruqya-healingg',
            cacheExpiry: 5 * 60 * 1000,
            debounceDelay: 350,
            maxRetries: 2,
            retryDelay: 1500,
            storageKeys: {
                token: 'github_token',
                favorites: 'favorites',
                readProgress: 'readProgress',
                sortBy: 'sortBy',
                theme: 'theme',
                activeRepo: 'active_repo_full_name'
            }
        };
        
        // ===== STATE =====
        let state = {
            currentPath: '',
            allItems: [],
            favorites: [],
            readProgress: {},
            viewMode: 'grid',
            sortBy: 'name',
            filterTag: 'all',
            searchQuery: '',
            showFavoritesOnly: false,
            githubToken: '',
            githubSessionValid: false,
            isWriteEnabled: false,
            totalHtmlFiles: 0,
            isMobileViewport: false,
            folderPwdConfig: null,
            activeRepo: null,
            reposWithPush: [],
            reposListLoadedForToken: null,
            // Editing
            editingFilePath: null,
            editingFileSha: null
        };
        
        // ===== UTILS =====
        const $ = (sel, ctx = document) => ctx.querySelector(sel);
        const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
        
        const escapeHtml = (s) => {
            if (!s) return s;
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return s.replace(/[&<>"']/g, m => map[m]);
        };
        
        const toBase64 = (str) => {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            bytes.forEach(b => binary += String.fromCharCode(b));
            return btoa(binary);
        };
        
        const fromBase64 = (base64) => {
            const binary = atob(base64);
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        };
        
        const debounce = (fn, delay) => {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn.apply(this, args), delay);
            };
        };
        
        const formatFileSize = (bytes) => {
            if (!bytes) return '';
            const units = ['B', 'КБ', 'МБ', 'ГБ'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return bytes.toFixed(i ? 1 : 0) + ' ' + units[i];
        };
        
        const showToast = (message, isError = false) => {
            // Remove existing toasts
            $$('.toast').forEach(t => t.remove());
            
            const toast = document.createElement('div');
            toast.className = `toast${isError ? ' error' : ''}`;
            toast.setAttribute('role', 'alert');
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // Auto-remove
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(16px)';
                setTimeout(() => toast.remove(), 200);
            }, 2800);
        };
        
        const maskToken = (token) => {
            if (!token || token.length < 8) return '****';
            return '····' + token.slice(-4);
        };
        
        const setGlobalLoading = (loading) => {
            const spinner = $('#globalSpinner');
            if (spinner) {
                spinner.classList.toggle('show', loading);
                spinner.setAttribute('aria-busy', loading ? 'true' : 'false');
            }
        };
        
        const closeAllDropdowns = () => {
            $$('.dropdown-menu').forEach(m => m.remove());
            $$('.has-menu-open').forEach(c => c.classList.remove('has-menu-open'));
        };
        
        // ===== CACHE =====
        const apiCache = new Map();
        const getCached = (key) => {
            const entry = apiCache.get(key);
            if (!entry) return null;
            if (Date.now() - entry.ts > CONFIG.cacheExpiry) {
                apiCache.delete(key);
                return null;
            }
            return entry.data;
        };
        const setCache = (key, data) => {
            apiCache.set(key, { data, ts: Date.now() });
        };
        const clearCache = () => apiCache.clear();
        
        // ===== API REQUESTS =====
        const apiRequest = async (method, url, body = null) => {
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (state.githubToken) headers['Authorization'] = `Bearer ${state.githubToken}`;
            if (body) {
                headers['Content-Type'] = 'application/json';
            }
            
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(url, options);
            
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                const error = new Error(errorData.message || `GitHub API: ${response.status}`);
                error.status = response.status;
                error.responseBody = errorData;
                throw error;
            }
            
            return response.status !== 204 ? await response.json() : null;
        };
        
        const fetchRepoContents = async (path = '', retries = 0) => {
            const cacheKey = `${state.activeRepo.full_name}|${state.activeRepo.branch}|c:${path}`;
            const cached = getCached(cacheKey);
            if (cached) return cached;
            
            const url = `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${path}?ref=${state.activeRepo.branch}`;
            
            try {
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (state.githubToken) headers['Authorization'] = `Bearer ${state.githubToken}`;
                
                const response = await fetch(url, { headers });
                
                if (response.status === 403 && retries < CONFIG.maxRetries) {
                    await new Promise(res => setTimeout(res, CONFIG.retryDelay));
                    return fetchRepoContents(path, retries + 1);
                }
                
                if (response.status === 404) {
                    const error = new Error(`Папка не найдена: ${path || '/'}`);
                    error.status = 404;
                    throw error;
                }
                
                if (!response.ok) {
                    throw new Error(`Ошибка API: ${response.status}`);
                }
                
                const data = await response.json();
                if (!Array.isArray(data)) {
                    const error = new Error('Это файл, а не папка');
                    error.notFolder = true;
                    throw error;
                }
                
                setCache(cacheKey, data);
                return data;
            } catch (error) {
                if (retries < CONFIG.maxRetries) {
                    await new Promise(res => setTimeout(res, CONFIG.retryDelay));
                    return fetchRepoContents(path, retries + 1);
                }
                throw error;
            }
        };
        
        // ===== REPO MANAGEMENT =====
        const normalizePagesBase = (base) => (base || '').replace(/\/+$/, '');
        
        const repoFromConfig = () => ({
            owner: CONFIG.owner,
            repo: CONFIG.repo,
            branch: CONFIG.branch,
            pagesBase: normalizePagesBase(CONFIG.pagesBase),
            full_name: `${CONFIG.owner}/${CONFIG.repo}`
        });
        
        const githubPagesBaseFromRepo = (owner, name) => 
            normalizePagesBase(`https://${owner}.github.io/${name}/`);
        
        const repoRecordFromApi = (r) => {
            const owner = r.owner?.login;
            const name = r.name;
            if (!owner || !name) return null;
            return {
                owner,
                repo: name,
                branch: r.default_branch || 'main',
                pagesBase: githubPagesBaseFromRepo(owner, name),
                full_name: r.full_name || `${owner}/${name}`
            };
        };
        
        const parseNextLink = (linkHeader) => {
            if (!linkHeader) return null;
            const match = linkHeader.match(/<([^>]+)>;\s*rel="next"/);
            return match ? match[1] : null;
        };
        
        const fetchAllUserReposWithPush = async () => {
            const collected = [];
            let url = 'https://api.github.com/user/repos?per_page=100&affiliation=owner,collaborator,organization_member';
            
            while (url) {
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (state.githubToken) headers['Authorization'] = `Bearer ${state.githubToken}`;
                
                const response = await fetch(url, { headers });
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || `GitHub API: ${response.status}`);
                }
                
                const page = await response.json();
                if (Array.isArray(page)) {
                    for (const item of page) {
                        if (item.permissions?.push) {
                            const record = repoRecordFromApi(item);
                            if (record) collected.push(record);
                        }
                    }
                }
                url = parseNextLink(response.headers.get('Link'));
            }
            
            return collected.sort((a, b) => a.full_name.localeCompare(b.full_name, 'en'));
        };
        
        // ===== FOLDER PASSWORDS =====
        const getFolderPwdConfig = async () => {
            if (state.folderPwdConfig !== null) return state.folderPwdConfig;
            
            try {
                const file = await apiRequest('GET', 
                    `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/.folder-config?ref=${state.activeRepo.branch}`);
                const parsed = JSON.parse(fromBase64(file.content));
                state.folderPwdConfig = { hashes: parsed.hashes || {}, _sha: file.sha };
            } catch (e) {
                state.folderPwdConfig = { hashes: {}, _sha: null };
            }
            return state.folderPwdConfig;
        };
        
        const hashPassword = async (pwd) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(pwd + state.activeRepo.owner + state.activeRepo.repo);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        };
        
        const folderLockKey = (path) => `flk_${state.activeRepo.full_name}|${path}`;
        const isFolderUnlocked = (path) => sessionStorage.getItem(folderLockKey(path)) === '1';
        const setFolderUnlocked = (path) => sessionStorage.setItem(folderLockKey(path), '1');
        
        // ===== FILE OPERATIONS =====
        const itemExists = async (path) => {
            try {
                await apiRequest('GET', 
                    `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${path}?ref=${state.activeRepo.branch}`);
                return true;
            } catch (e) {
                if (e.status === 404) return false;
                throw e;
            }
        };
        
        const createFolder = async (name) => {
            if (!state.githubToken) throw new Error('Токен не задан');
            if (!state.isWriteEnabled) throw new Error('Режим записи не активирован');
            
            const folderPath = state.currentPath ? `${state.currentPath}/${name}` : name;
            if (await itemExists(folderPath)) {
                throw new Error('Папка уже существует');
            }
            
            await apiRequest('PUT', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${folderPath}/.gitkeep`, {
                message: `Создана папка ${name}`,
                content: toBase64(''),
                branch: state.activeRepo.branch
            });
            clearCache();
        };
        
        const deleteItem = async (path, isFolder) => {
            if (!state.githubToken) throw new Error('Токен не задан');
            if (!state.isWriteEnabled) throw new Error('Режим записи не активирован');
            
            if (isFolder) {
                // Recursive delete
                const items = await fetchRepoContents(path);
                for (const item of items) {
                    const itemPath = `${path}/${item.name}`;
                    if (item.type === 'dir') {
                        await deleteItem(itemPath, true);
                    } else {
                        const meta = await apiRequest('GET', 
                            `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${itemPath}`);

                actions.push({ 
                    label: state.readProgress[fp] ? '✅ Уже прочитано' : '📌 Отметить прочитанным', 
                    action: () => { markRead(fp); renderCurrentView(); } 
                });
                
                if (state.isWriteEnabled) {
                    actions.push({ divider: true });
                    actions.push({ label: '✏️ Редактировать', action: () => openEditorForFile(fp, data.name) });
                    actions.push({ 
                        label: '✏️ Переименовать', 
                        action: async () => {
                            const newName = prompt('Новое имя:', data.name);
                            if (newName && newName !== data.name) {
                                setGlobalLoading(true);
                                try {
                                    await renameItem(fp, newName);
                                    showToast('✅ Переименовано');
                                    renderCurrentView();
                                } catch (e) { showToast(e.message, true); }
                                finally { setGlobalLoading(false); }
                            }
                        }
                    });
                    actions.push({ 
                        label: '🗑️ Удалить', 
                        action: async () => {
                            if (confirm(`Удалить «${data.name}»?`)) {
                                setGlobalLoading(true);
                                try {
                                    await deleteItem(fp, false);
                                    showToast('Файл удалён');
                                    renderCurrentView();
                                } catch (e) { showToast(e.message, true); }
                                finally { setGlobalLoading(false); }
                            }
                        }
                    });
                }
            } else {
                actions.push({ label: '📂 Открыть папку', action: () => { state.currentPath = data.path; updateUrlState(); renderCurrentView(); } });
                actions.push({ label: '📋 Копировать ссылку', action: () => copyToClipboard(getFolderUrl(data.path)) });
                actions.push({ label: '📋 Копировать (только чтение)', action: () => copyToClipboard(getFolderUrl(data.path, true)) });
                
                if (state.isWriteEnabled) {
                    actions.push({ divider: true });
                    const cfg = state.folderPwdConfig;
                    const isLocked = cfg?.hashes?.[data.path];
                    if (!isLocked) {
                        actions.push({ label: '🔒 Установить пароль', action: () => manageFolderPassword(data.path, 'set') });
                    } else {
                        actions.push({ label: '🔑 Сменить пароль', action: () => manageFolderPassword(data.path, 'change') });
                        actions.push({ label: '🔓 Снять пароль', action: () => manageFolderPassword(data.path, 'remove') });
                    }
                    actions.push({ divider: true });
                    actions.push({ 
                        label: '🗑️ Удалить папку', 
                        action: async () => {
                            if (confirm(`Удалить папку «${data.name}» и всё содержимое?`)) {
                                setGlobalLoading(true);
                                try {
                                    await deleteItem(data.path, true);
                                    showToast('Папка удалена');
                                    renderCurrentView();
                                } catch (e) { showToast(e.message, true); }
                                finally { setGlobalLoading(false); }
                            }
                        }
                    });
                }
            }
            
            actions.forEach(item => {
                if (item.divider) {
                    const div = document.createElement('div');
                    div.className = 'divider';
                    div.setAttribute('role', 'separator');
                    menu.appendChild(div);
                    return;
                }
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = item.label;
                btn.setAttribute('role', 'menuitem');
                btn.onclick = (e) => {
                    e.stopPropagation();
                    item.action();
                    closeAllDropdowns();
                };
                menu.appendChild(btn);
            });
            
            // Position & show
            const parentCard = btn.closest('.file-card, .folder-card');
            if (parentCard) parentCard.classList.add('has-menu-open');
            btn.closest('.item-actions')?.appendChild(menu);
            menu.style.display = 'flex';
            
            // Close on outside click
            requestAnimationFrame(() => {
                const handler = (e) => {
                    if (!menu.contains(e.target) && e.target !== btn) {
                        closeAllDropdowns();
                        document.removeEventListener('click', handler);
                    }
                };
                document.addEventListener('click', handler);
            });
        };
        
        // ===== HELPERS =====
        const getFileUrl = (folder, fileName) => {
            const parts = [state.activeRepo.pagesBase];
            if (folder) parts.push(folder);
            parts.push(fileName);
            return parts.join('/');
        };
        
        const getFolderUrl = (folderPath, readOnly = false) => {
            const url = new URL(window.location);
            url.hash = '';
            if (folderPath) url.searchParams.set('path', folderPath);
            else url.searchParams.delete('path');
            if (readOnly) url.searchParams.set('readonly', '1');
            else url.searchParams.delete('readonly');
            // Repo param
            if (!state.githubToken || state.reposWithPush.length === 0) {
                url.searchParams.delete('repo');
            } else {
                const def = `${CONFIG.owner}/${CONFIG.repo}`;
                if (state.activeRepo.full_name.toLowerCase() !== def.toLowerCase()) {
                    url.searchParams.set('repo', state.activeRepo.full_name);
                } else {
                    url.searchParams.delete('repo');
                }
            }
            return url.toString();
        };
        
        const openFileUrl = (url) => {
            const w = window.open(url, '_blank', 'noopener,noreferrer');
            if (!w || w.closed || typeof w.closed === 'undefined') {
                window.location.href = url;
            }
        };
        
        const copyToClipboard = async (text) => {
            try {
                if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.cssText = 'position:fixed;top:-1000px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                showToast('✅ Ссылка скопирована');
            } catch {
                showToast('Не удалось скопировать. Скопируйте вручную', true);
            }
        };
        
        const toggleFavorite = (fp) => {
            const idx = state.favorites.indexOf(fp);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
            } else {
                state.favorites.push(fp);
            }
            localStorage.setItem(CONFIG.storageKeys.favorites, JSON.stringify(state.favorites));
        };
        
        const markRead = (fp) => {
            state.readProgress[fp] = true;
            localStorage.setItem(CONFIG.storageKeys.readProgress, JSON.stringify(state.readProgress));
        };
        
        // ===== MODAL: PASSWORD =====
        const showPasswordModal = (opts) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            overlay.innerHTML = `
                <div class="modal-card" style="max-width:380px">
                    <h2 class="modal-title">${opts.title || '🔒 Введите пароль'}</h2>
                    <div class="modal-field">
                        <label for="pwdInput">${opts.fieldLabel || 'Пароль'}</label>
                        <input type="password" id="pwdInput" placeholder="${opts.placeholder || ''}" autocomplete="current-password" autofocus>
                    </div>
                    <div class="modal-actions">
                        <button type="button" id="pwdCancel">Отмена</button>
                        <button type="button" id="pwdConfirm" class="btn-success">${opts.confirmLabel || 'Войти'}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            const input = $('#pwdInput', overlay);
            const confirmBtn = $('#pwdConfirm', overlay);
            const cancelBtn = $('#pwdCancel', overlay);
            
            const cleanup = () => {
                overlay.remove();
                opts.onCancel?.();
            };
            
            cancelBtn.onclick = cleanup;
            overlay.onclick = (e) => { if (e.target === overlay) cleanup(); };
            confirmBtn.onclick = () => opts.onConfirm?.(input.value);
            input.onkeydown = (e) => { if (e.key === 'Enter') confirmBtn.click(); };
            input.focus();
        };
        
        // ===== MODAL: EDITOR =====
        const openEditor = (isEdit = false, filePath = null, fileSha = null, content = '', fileName = '', patientName = '', fileType = 'анализ', tags = '') => {
            const modal = $('#editorModal');
            if (!modal) return;
            
            state.editingFilePath = filePath;
            state.editingFileSha = fileSha;
            
            $('#modalTitle').textContent = isEdit ? `✏️ Редактирование: ${fileName}` : '➕ Новая страница';
            $('#editFileName').value = fileName.replace(/\.html$/, '');
            $('#editPatientName').value = patientName;
            $('#editFileType').value = fileType;
            if ($('#editTags')) $('#editTags').value = tags;
            $('#editFileContent').value = content || generatePatientHtml(patientName || 'Имя пациента', fileType, tags);
            
            modal.style.display = 'flex';
            closeAllDropdowns();
            
            // Focus first input
            setTimeout(() => $('#editFileName')?.focus(), 100);
        };
        
        const closeEditor = () => {
            const modal = $('#editorModal');
            if (modal) modal.style.display = 'none';
            state.editingFilePath = null;
            state.editingFileSha = null;
        };
        
        // ===== INIT =====
        const init = async () => {
            // Load from localStorage
            state.favorites = JSON.parse(localStorage.getItem(CONFIG.storageKeys.favorites) || '[]');
            state.readProgress = JSON.parse(localStorage.getItem(CONFIG.storageKeys.readProgress) || '{}');
            state.sortBy = localStorage.getItem(CONFIG.storageKeys.sortBy) || 'name';
            state.githubToken = localStorage.getItem(CONFIG.storageKeys.token) || '';
            
            // Theme
            if (localStorage.getItem(CONFIG.storageKeys.theme) === 'dark') {
                document.body.classList.add('dark');
            }
            
            // View mode (auto-detect mobile)
            state.isMobileViewport = window.matchMedia('(max-width: 768px)').matches;
            state.viewMode = state.isMobileViewport ? 'list' : 'grid';
            
            // Quotes
            const quotes = [
                "«С именем Аллаха, Который исцеляет» — читайте рукъю с верой.",
                "«Ниспосылаем в Коране то, что является исцелением» (17:82)",
                "Пророк ﷺ сказал: «Нет болезни, для которой Аллах не создал лекарства».",
                "Чтение Аль-Фатихи — величайшее исцеление.",
                "Дуа — оружие верующего. Просите у Аллаха исцеления."
            ];
            const quoteEl = $('#quoteContainer');
            if (quoteEl) {
                quoteEl.textContent = quotes[Math.floor(Math.random() * quotes.length)];
            }
            
            // Theme toggle
            const themeBtn = $('#themeToggle');
            if (themeBtn) {
                themeBtn.onclick = () => {
                    document.body.classList.toggle('dark');
                    const isDark = document.body.classList.contains('dark');
                    localStorage.setItem(CONFIG.storageKeys.theme, isDark ? 'dark' : 'light');
                    themeBtn.textContent = isDark ? '☀️' : '🌙';
                    themeBtn.setAttribute('aria-label', isDark ? 'Светлая тема' : 'Тёмная тема');
                };
                themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            }
            
            // Search
            const searchInput = $('#searchInput');
            const searchClear = $('#searchClear');
            const debouncedSearch = debounce(() => renderCurrentView(), CONFIG.debounceDelay);
            
            if (searchInput) {
                searchInput.oninput = (e) => {
                    state.searchQuery = e.target.value;
                    if (searchClear) searchClear.style.display = state.searchQuery ? 'block' : 'none';
                    debouncedSearch();
                };
            }
            if (searchClear) {
                searchClear.onclick = () => {
                    if (searchInput) {
                        searchInput.value = '';
                        state.searchQuery = '';
                        searchClear.style.display = 'none';
                    }
                    renderCurrentView();
                };
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && !e.ctrlKey && !e.metaKey && 
                    document.activeElement.tagName !== 'INPUT' && 
                    document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput?.focus();
                }
                if (e.key === 'Escape') {
                    searchInput?.blur();
                    closeAllDropdowns();
                    closeEditor();
                }
            });
            
            // Token toggle
            const tokenToggle = $('#tokenToggle');
            const tokenBody = $('#tokenBody');
            if (tokenToggle && tokenBody) {
                tokenToggle.onclick = () => {
                    const isOpen = tokenToggle.classList.toggle('open');
                    tokenBody.classList.toggle('open');
                    tokenToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                };
            }
            
            // Save token
            const saveTokenBtn = $('#saveTokenBtn');
            if (saveTokenBtn) {
                saveTokenBtn.onclick = async () => {
                    const token = $('#githubToken')?.value.trim();
                    if (token) {
                        state.githubToken = token;
                        localStorage.setItem(CONFIG.storageKeys.token, token);
                        await tryEnableWrite();
                        await renderCurrentView();
                    }
                };
            }
            
            // Action buttons
            $('#newHtmlBtn')?.addEventListener('click', () => openEditor());
            $('#createFolderBtn')?.addEventListener('click', showCreateFolderModal);
            $('#uploadFileBtn')?.addEventListener('click', handleFileUpload);
            
            // Feedback
            $('#feedbackBtn')?.addEventListener('click', () => {
                const choice = prompt('Способ связи:\n1 — Telegram\n2 — Email\n\nВведите 1 или 2:');
                if (choice === '1') window.open('https://t.me/abu_muhammad_ruqya', '_blank');
                else if (choice === '2') window.location.href = 'mailto:admin@example.com?subject=Архив рукъи';
            });
            
            // Initialize repo
            state.activeRepo = repoFromConfig();
            
            // Try enable write mode
            if (state.githubToken) {
                await tryEnableWrite();
            }
            
            // Bind events
            bindFileListEvents();
            
            // Initial render
            await renderCurrentView();
        };
        
        // Placeholder functions for modals
        const showCreateFolderModal = () => showToast('Создание папки (демо)', false);
        const handleFileUpload = () => showToast('Загрузка файлов (демо)', false);
        const tryEnableWrite = async () => {
            if (!state.githubToken) {
                state.isWriteEnabled = false;
                updateWriteModeUI();
                return;
            }
            try {
                // Verify token
                await apiRequest('GET', 'https://api.github.com/user');
                state.githubSessionValid = true;
                
                // Load repos
                state.reposWithPush = await fetchAllUserReposWithPush();
                
                // Verify repo access
                const repoInfo = await apiRequest('GET', 
                    `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}`);
                state.isWriteEnabled = !!repoInfo?.permissions?.push;
                
            } catch (e) {
                console.error('Token verification failed:', e);
                state.isWriteEnabled = false;
            }
            updateWriteModeUI();
        };
        
        const updateWriteModeUI = () => {
            document.body.classList.toggle('write-mode', state.isWriteEnabled);
            document.body.classList.toggle('readonly-share', false);
            
            const banner = $('#writeModeBanner');
            if (banner) {
                banner.hidden = !state.isWriteEnabled;
                if (state.isWriteEnabled) {
                    banner.textContent = '✅ Режим записи активен';
                }
            }
            
            const actionBar = $('#actionBar');
            if (actionBar) {
                actionBar.hidden = !state.isWriteEnabled;
            }
            
            // Update button states
            $('#uploadFileBtn')?.toggleAttribute('disabled', !state.isWriteEnabled);
            $('#createFolderBtn')?.toggleAttribute('disabled', !state.isWriteEnabled);
        };
        
        // Move file helper
        const moveFile = async (src, destFolder, fileName) => {
            const destPath = destFolder ? `${destFolder}/${fileName}` : fileName;
            if (src === destPath) return;
            if (await itemExists(destPath)) throw new Error('Файл уже существует');
            
            const srcMeta = await apiRequest('GET', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${src}?ref=${state.activeRepo.branch}`);
            
            // Create at new location
            await apiRequest('PUT', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${destPath}`, {
                message: `Перемещение ${fileName}`,
                content: srcMeta.content,
                branch: state.activeRepo.branch
            });
            
            // Delete old
            await apiRequest('DELETE', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${src}`, {
                message: 'Удаление после перемещения',
                sha: srcMeta.sha,
                branch: state.activeRepo.branch
            });
            clearCache();
        };
        
        const renameItem = async (path, newName) => {
            const parent = path.substring(0, path.lastIndexOf('/'));
            const newPath = parent ? `${parent}/${newName}` : newName;
            if (await itemExists(newPath)) throw new Error('Элемент уже существует');
            
            const meta = await apiRequest('GET', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${path}?ref=${state.activeRepo.branch}`);
            
            await apiRequest('PUT', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${newPath}`, {
                message: `Переименование в ${newName}`,
                content: meta.content,
                branch: state.activeRepo.branch
            });
            await apiRequest('DELETE', 
                `https://api.github.com/repos/${state.activeRepo.owner}/${state.activeRepo.repo}/contents/${path}`, {
                message: 'Удаление старого',
                sha: meta.sha,
                branch: state.activeRepo.branch
            });
            clearCache();
        };
        
        const manageFolderPassword = (path, action) => {
            showToast(`Управление паролем: ${action} (демо)`, false);
        };
        
        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
    })();
    </script>
</body>
</html>
