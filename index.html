<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover">
    <title>Духовный центр Абу Мухаммада | Архив рукъи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8f0e0 0%, #f3e5c9 100%);
            font-family: 'Segoe UI', 'Amiri', 'Georgia', serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-card {
            background: linear-gradient(145deg, #fff6e6, #fcefcb);
            border-radius: 48px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            border: 1px solid #e8d5a3;
        }

        .gold-title {
            font-size: 2rem;
            color: #b37b2e;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #7a5a2e;
            font-size: 1.1rem;
            border-top: 2px solid #e2c48b;
            display: inline-block;
            padding-top: 0.5rem;
        }

        .files-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 2rem;
        }

        .folder-wrapper {
            background: rgba(255, 252, 240, 0.95);
            border-radius: 28px;
            border: 1px solid #eedfa8;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
            margin-bottom: 8px;
        }

        .folder-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: #fffef5;
            border-radius: 28px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .folder-header:hover {
            background: #fef6e5;
        }

        .folder-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .folder-icon {
            font-size: 2rem;
        }

        .folder-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #8b5a2b;
            letter-spacing: 0.3px;
        }

        .folder-badge {
            background: #e7d7b4;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.75rem;
            color: #5a3e1b;
            margin-left: 12px;
        }

        .folder-toggle {
            font-size: 1.3rem;
            color: #c29a47;
            transition: transform 0.2s;
        }

        .folder-children {
            border-top: 1px solid #f0e3c6;
            padding: 12px 0 12px 24px;
            background: #fffef8;
            display: none;
        }

        .folder-children.open {
            display: block;
        }

        .file-card {
            background: rgba(255, 252, 240, 0.95);
            border: 1px solid #eedfa8;
            border-radius: 20px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.2s;
        }

        .file-card:hover {
            transform: translateX(4px);
            background: #fffae9;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .file-icon {
            font-size: 1.8rem;
        }

        .file-name {
            font-size: 1rem;
            font-weight: 600;
            color: #4a3727;
            word-break: break-word;
        }

        .file-date {
            font-size: 0.75rem;
            color: #a08147;
            margin-top: 4px;
        }

        .btn-visit {
            background: #d4a53c;
            color: #2c2418;
            padding: 8px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            font-size: 0.85rem;
        }

        .btn-visit:hover {
            background: #c4922a;
            transform: scale(1.02);
            color: white;
        }

        .empty-message {
            background: #fff2df;
            padding: 2rem;
            border-radius: 32px;
            text-align: center;
            color: #8b6942;
        }

        .footer-note {
            text-align: center;
            margin-top: 2rem;
            color: #b49463;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: #c9a03d;
        }

        .breadcrumb {
            background: #faf1e0;
            border-radius: 60px;
            padding: 8px 18px;
            margin-bottom: 18px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .breadcrumb:hover {
            background: #ecdcaa;
        }

        .repo-root-link {
            font-weight: bold;
            color: #b37b2e;
        }

        .sub-item {
            margin: 8px 0;
            background: #fff9ef;
            border-radius: 18px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sub-folder {
            background: #fef7e8;
            margin-left: 16px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-small {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <div class="gold-title">📖 Духовный центр Абу Мухаммада</div>
        <div class="subtitle">Архив рукъя-анализов и исцеляющих страниц</div>
        <p style="margin-top: 20px; color: #5e4a2a;">Да облегчит Аллах путь к исцелению каждого, кто откроет эти страницы</p>
    </div>

    <div id="breadcrumbArea" style="margin-bottom: 12px;"></div>

    <div id="fileListContainer" class="files-grid">
        <div class="loading">🔍 Загрузка списка файлов и папок из GitHub...</div>
    </div>
    
    <div class="footer-note">
        🤲 Да примет Аллах наше благое намерение. Каждая страница — ключ к исцелению с дозволения Всевышнего.
    </div>
</div>

<script>
    // ---------- Конфигурация репозитория ----------
    // Определяем owner и repo из текущего URL GitHub Pages
    let owner = 'kingboob8880-pixel';
    let repo = 'ruqya-healingg';
    
    // Получаем базовый путь для GitHub Pages
    // Например: https://kingboob8880-pixel.github.io/ruqya-healingg/
    function getBasePath() {
        // Получаем путь от корня домена до index.html
        const pathname = window.location.pathname;
        // Если pathname заканчивается на /index.html или просто /, убираем index.html
        let basePath = pathname.substring(0, pathname.lastIndexOf('/') + 1);
        // Если basePath пустой или только /, используем /
        if (!basePath) basePath = '/';
        return basePath;
    }
    
    let currentPath = '';  // текущая папка внутри репозитория (относительно корня)
    const contentsCache = new Map();
    
    // Функция получения содержимого папки через GitHub API
    async function fetchRepoContents(path = '') {
        const cacheKey = path;
        if (contentsCache.has(cacheKey)) {
            return contentsCache.get(cacheKey);
        }
        
        let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        apiUrl += `?ref=main`;
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Папка не найдена');
                }
                throw new Error(`GitHub API ошибка: ${response.status}`);
            }
            const data = await response.json();
            if (!Array.isArray(data)) {
                return [];
            }
            contentsCache.set(cacheKey, data);
            return data;
        } catch (err) {
            console.error('Ошибка загрузки:', err);
            throw err;
        }
    }
    
    // Формирование правильного URL для HTML-файла
    function getFileUrl(filePath, fileName) {
        // Базовый URL: текущий origin + basePath (путь до репозитория на GitHub Pages)
        const baseUrl = window.location.origin + getBasePath();
        
        // Путь к файлу относительно корня репозитория
        let relativeFilePath = '';
        if (filePath) {
            relativeFilePath = filePath + '/' + fileName;
        } else {
            relativeFilePath = fileName;
        }
        
        // Убираем двойные слеши и формируем финальный URL
        let fullUrl = baseUrl + relativeFilePath;
        fullUrl = fullUrl.replace(/\/\//g, '/');
        return fullUrl;
    }
    
    // Хлебные крошки
    function renderBreadcrumb() {
        const breadDiv = document.getElementById('breadcrumbArea');
        const parts = currentPath ? currentPath.split('/') : [];
        let breadHtml = `<div class="breadcrumb" id="goRootBtn">🏠 <span class="repo-root-link">${repo}</span></div>`;
        
        let accumulatedPath = '';
        for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            accumulatedPath += (i === 0 ? part : '/' + part);
            breadHtml += `<span style="margin:0 4px; color:#b8893a;">/</span>`;
            breadHtml += `<div class="breadcrumb" data-bread-path="${accumulatedPath}" style="display:inline-flex;">📁 ${escapeHtml(part)}</div>`;
        }
        breadDiv.innerHTML = breadHtml;
        
        const rootBtn = document.getElementById('goRootBtn');
        if (rootBtn) {
            rootBtn.addEventListener('click', async () => {
                currentPath = '';
                await renderCurrentDirectory();
            });
        }
        
        document.querySelectorAll('[data-bread-path]').forEach(el => {
            el.addEventListener('click', async (e) => {
                const targetPath = el.getAttribute('data-bread-path');
                if (targetPath !== undefined) {
                    currentPath = targetPath;
                    await renderCurrentDirectory();
                }
            });
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function generateId(str) {
        return str.replace(/[^a-zA-Z0-9]/g, '_');
    }
    
    // Загрузка содержимого подпапки для аккордеона
    async function loadSubfolderContent(folderPath, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        try {
            const subItems = await fetchRepoContents(folderPath);
            const subFolders = subItems.filter(i => i.type === 'dir');
            const subHtmlFiles = subItems.filter(i => i.type === 'file' && i.name.toLowerCase().endsWith('.html') && i.name.toLowerCase() !== 'index.html');
            
            if (subFolders.length === 0 && subHtmlFiles.length === 0) {
                container.innerHTML = '<div style="padding: 16px; color:#8b6942;">✨ В этой папке пока нет вложенных HTML или папок.</div>';
                return;
            }
            
            let html = '';
            
            // Отображаем подпапки
            for (const subFolder of subFolders) {
                html += `
                    <div class="sub-item sub-folder">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span>📁</span>
                            <strong style="color:#7a582b;">${escapeHtml(subFolder.name)}</strong>
                            <span style="font-size:0.7rem; background:#e2d2b0; padding:2px 10px; border-radius:30px;">папка</span>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-visit btn-small navigate-to-folder" data-path="${subFolder.path}">🔽 Перейти</button>
                        </div>
                    </div>
                `;
            }
            
            // Отображаем HTML-файлы
            for (const subFile of subHtmlFiles) {
                const fileUrl = getFileUrl(folderPath, subFile.name);
                let icon = '📄';
                if (subFile.name.includes('анализ') || subFile.name.includes('analysis')) icon = '🕯️';
                if (subFile.name.includes('сестра') || subFile.name.includes('brother')) icon = '🌿';
                if (subFile.name.includes('дуа') || subFile.name.includes('dua')) icon = '🤲';
                
                html += `
                    <div class="sub-item">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span>${icon}</span>
                            <span>${escapeHtml(subFile.name)}</span>
                        </div>
                        <a href="${fileUrl}" target="_blank" class="btn-visit btn-small">📖 Открыть</a>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            
            // Обработчики для кнопок перехода в подпапки
            document.querySelectorAll('.navigate-to-folder').forEach(btn => {
                btn.addEventListener('click', async (ev) => {
                    const targetPath = btn.getAttribute('data-path');
                    if (targetPath) {
                        currentPath = targetPath;
                        await renderCurrentDirectory();
                    }
                });
            });
            
        } catch (err) {
            container.innerHTML = `<div style="padding:12px; color:#b13e3e;">⚠️ Не удалось загрузить содержимое: ${err.message}</div>`;
        }
    }
    
    // Основная функция отображения
    async function renderCurrentDirectory() {
        const container = document.getElementById('fileListContainer');
        if (!container) return;
        
        container.innerHTML = '<div class="loading">📁 Загрузка содержимого...</div>';
        
        try {
            const items = await fetchRepoContents(currentPath);
            const folders = items.filter(item => item.type === 'dir');
            const htmlFiles = items.filter(item => 
                item.type === 'file' && 
                item.name.toLowerCase().endsWith('.html') && 
                item.name.toLowerCase() !== 'index.html'
            );
            
            if (folders.length === 0 && htmlFiles.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        🌙 В этой папке нет HTML-файлов или подпапок.
                        ${currentPath ? '<br><br>⬅️ Используйте хлебные крошки для возврата.' : ''}
                    </div>
                `;
                renderBreadcrumb();
                return;
            }
            
            let contentHtml = '';
            
            // Отображаем папки с аккордеоном для предпросмотра
            for (const folder of folders) {
                const childContainerId = `subfolder-${generateId(folder.path)}`;
                contentHtml += `
                    <div class="folder-wrapper">
                        <div class="folder-header" data-folder-path="${folder.path}">
                            <div class="folder-info">
                                <div class="folder-icon">📁</div>
                                <div>
                                    <div class="folder-name">${escapeHtml(folder.name)}</div>
                                    <div class="file-date">📂 папка</div>
                                </div>
                                <span class="folder-badge">нажмите для просмотра</span>
                            </div>
                            <div class="folder-toggle">▼</div>
                        </div>
                        <div class="folder-children" id="${childContainerId}">
                            <div class="loading" style="padding: 12px;">⏳ загрузка содержимого...</div>
                        </div>
                    </div>
                `;
            }
            
            // Отображаем HTML-файлы
            for (const file of htmlFiles) {
                let icon = '📄';
                if (file.name.includes('анализ') || file.name.includes('analysis')) icon = '🕯️';
                if (file.name.includes('сестра') || file.name.includes('brother')) icon = '🌿';
                if (file.name.includes('дуа') || file.name.includes('dua')) icon = '🤲';
                
                const fileUrl = getFileUrl(currentPath, file.name);
                
                let dateStr = '';
                if (file.commit?.committer?.date) {
                    const date = new Date(file.commit.committer.date);
                    dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                }
                
                contentHtml += `
                    <div class="file-card">
                        <div class="file-info">
                            <div class="file-icon">${icon}</div>
                            <div>
                                <div class="file-name">${escapeHtml(file.name)}</div>
                                ${dateStr ? `<div class="file-date">📅 ${dateStr}</div>` : ''}
                            </div>
                        </div>
                        <a href="${fileUrl}" class="btn-visit" target="_blank">📖 Открыть анализ</a>
                    </div>
                `;
            }
            
            container.innerHTML = contentHtml;
            renderBreadcrumb();
            
            // Добавляем обработчики для папок (аккордеон)
            for (const folder of folders) {
                const folderHeader = document.querySelector(`.folder-header[data-folder-path="${folder.path.replace(/"/g, '\\"')}"]`);
                if (folderHeader) {
                    const childrenContainer = folderHeader.closest('.folder-wrapper').querySelector('.folder-children');
                    const toggleIcon = folderHeader.querySelector('.folder-toggle');
                    const childContainerId = childrenContainer.id;
                    let loaded = false;
                    
                    folderHeader.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const isOpen = childrenContainer.classList.contains('open');
                        
                        if (!isOpen) {
                            childrenContainer.classList.add('open');
                            if (toggleIcon) toggleIcon.style.transform = 'rotate(180deg)';
                            
                            if (!loaded) {
                                await loadSubfolderContent(folder.path, childContainerId);
                                loaded = true;
                            }
                        } else {
                            childrenContainer.classList.remove('open');
                            if (toggleIcon) toggleIcon.style.transform = 'rotate(0deg)';
                        }
                    });
                }
            }
            
        } catch (err) {
            console.error(err);
            container.innerHTML = `
                <div class="empty-message">
                    ⚠️ Ошибка загрузки: ${err.message || 'не удалось связаться с GitHub API'}. 
                    <br><br>📌 Убедитесь, что репозиторий публичный.<br>
                    📌 Владелец: ${owner}<br>
                    📌 Репозиторий: ${repo}<br>
                    📌 Текущий путь: ${currentPath || 'корень'}
                </div>
            `;
            renderBreadcrumb();
        }
    }
    
    // Инициализация
    window.addEventListener('DOMContentLoaded', async () => {
        // Пробуем определить параметр ?path= в URL
        const urlParams = new URLSearchParams(window.location.search);
        const startPath = urlParams.get('path');
        if (startPath && startPath.trim() !== '') {
            currentPath = startPath;
        } else {
            currentPath = '';
        }
        
        await renderCurrentDirectory();
    });
</script>
</body>
</html>
